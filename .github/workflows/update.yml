name: Atualizar AdriaFlix 🌊

on:
  # Sempre que você editar as fontes (ou o gerador)
  push:
    paths:
      - "fontes.json"
      - "scripts/**"
      - "exemplos/**"
      - ".github/workflows/update.yml"
  # Uma vez por dia, para manter os catálogos frescos (06:17 UTC = 03:17 em Brasília)
  schedule:
    - cron: "17 6 * * *"
  # Botão "Run workflow" na aba Actions
  workflow_dispatch:

permissions:
  contents: write   # para o commit automático da pasta docs/
  pages: write      # para pedir a publicação do GitHub Pages logo após o commit

concurrency:
  group: adriaflix-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar o addon (docs/)
        run: python3 scripts/build_addon.py

      - name: Commit automático da pasta docs/
        run: |
          git config user.name "adriaflix-bot"
          git config user.email "adriaflix-bot@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Nada mudou nos catálogos. Nenhum commit necessário."
          else
            git commit -m "🌊 Atualiza catálogos do AdriaFlix [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Pedir publicação do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Garante que o Pages publique o commit do bot. Se falhar, não é problema:
          # o Pages também publica sozinho a cada push.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages seguirá o fluxo normal."
